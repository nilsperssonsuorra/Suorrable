<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Suorrable app overview</title>
  <desc id="desc">Dark product diagram showing prompt, AI generation, build verification, live preview, project storage, and Vercel deployment.</desc>
  <rect width="1920" height="1080" fill="#070707"/>
  <circle cx="1510" cy="175" r="360" fill="#163B34" opacity=".32"/>
  <circle cx="280" cy="860" r="300" fill="#26323F" opacity=".28"/>
  <rect x="88" y="84" width="1744" height="912" rx="42" fill="#0D0D0D" stroke="#252525" stroke-width="2"/>
  <text x="150" y="165" fill="#F4F4F4" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800">Suorrable</text>
  <text x="150" y="215" fill="#9B9B9B" font-family="Inter, Arial, sans-serif" font-size="23">Prompt to generated app, verified preview, and deployable project workspace.</text>

  <rect x="150" y="292" width="460" height="542" rx="24" fill="#151515" stroke="#2B2B2B"/>
  <text x="196" y="356" fill="#F4F4F4" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800">Chat workspace</text>
  <rect x="196" y="398" width="348" height="78" rx="16" fill="#202020"/>
  <text x="224" y="446" fill="#E8E8E8" font-family="Inter, Arial, sans-serif" font-size="19">Build a SaaS dashboard...</text>
  <rect x="196" y="524" width="366" height="170" rx="18" fill="#101010" stroke="#2F2F2F"/>
  <text x="224" y="573" fill="#F4F4F4" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">Plan</text>
  <text x="224" y="618" fill="#AFAFAF" font-family="Inter, Arial, sans-serif" font-size="18">Generate files, install dependencies,</text>
  <text x="224" y="650" fill="#AFAFAF" font-family="Inter, Arial, sans-serif" font-size="18">build, verify, then show preview.</text>
  <rect x="196" y="738" width="348" height="48" rx="24" fill="#EAFEF3"/>
  <text x="285" y="769" fill="#07100D" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Send update</text>

  <g stroke="#6EE7B7" stroke-width="3" opacity=".9">
    <path d="M645 560 H760"/>
    <path d="M746 544 L762 560 L746 576"/>
  </g>

  <rect x="790" y="270" width="380" height="596" rx="26" fill="#111616" stroke="#29413A"/>
  <text x="840" y="338" fill="#D8FFF0" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800">Generation loop</text>
  <g font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">
    <rect x="840" y="394" width="278" height="58" rx="15" fill="#17211E"/><text x="870" y="431" fill="#F4F4F4">1. Stream files</text>
    <rect x="840" y="482" width="278" height="58" rx="15" fill="#17211E"/><text x="870" y="519" fill="#F4F4F4">2. Install + build</text>
    <rect x="840" y="570" width="278" height="58" rx="15" fill="#17211E"/><text x="870" y="607" fill="#F4F4F4">3. Runtime check</text>
    <rect x="840" y="658" width="278" height="58" rx="15" fill="#17211E"/><text x="870" y="695" fill="#F4F4F4">4. AI fix retry</text>
    <rect x="840" y="746" width="278" height="58" rx="15" fill="#D8FFF0"/><text x="870" y="783" fill="#07100D">5. Ready preview</text>
  </g>

  <g stroke="#6EE7B7" stroke-width="3" opacity=".9">
    <path d="M1208 560 H1320"/>
    <path d="M1306 544 L1322 560 L1306 576"/>
  </g>

  <rect x="1348" y="292" width="396" height="264" rx="24" fill="#111111" stroke="#303030"/>
  <text x="1394" y="356" fill="#F4F4F4" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800">Live preview</text>
  <rect x="1394" y="398" width="304" height="104" rx="16" fill="#EAFEF3"/>
  <rect x="1418" y="424" width="120" height="16" rx="8" fill="#07100D" opacity=".88"/>
  <rect x="1418" y="456" width="218" height="10" rx="5" fill="#07100D" opacity=".38"/>
  <rect x="1418" y="478" width="168" height="10" rx="5" fill="#07100D" opacity=".26"/>

  <rect x="1348" y="604" width="396" height="230" rx="24" fill="#111111" stroke="#303030"/>
  <text x="1394" y="666" fill="#F4F4F4" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800">Project system</text>
  <text x="1394" y="716" fill="#B8B8B8" font-family="Inter, Arial, sans-serif" font-size="19">Rename, duplicate, delete, reopen,</text>
  <text x="1394" y="750" fill="#B8B8B8" font-family="Inter, Arial, sans-serif" font-size="19">and deploy generated projects.</text>
  <rect x="1394" y="780" width="150" height="44" rx="22" fill="#1B1B1B" stroke="#3A3A3A"/>
  <text x="1432" y="809" fill="#E8E8E8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">Vercel</text>
</svg>
